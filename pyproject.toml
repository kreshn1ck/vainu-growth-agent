[project]
name = "vainu-growth-agent"
version = "0.1.0"
description = "Evidence-first ICP qualification using Vainu company data and optional AWS Bedrock scoring"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "httpx==0.28.1",
  "pydantic==2.11.9",
  "pydantic-settings==2.10.1",
  "boto3==1.40.29",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
